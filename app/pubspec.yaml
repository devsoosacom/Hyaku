name: hyaku
description: "百物語 - ホラー特化SNSアプリ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (接続時に有効化 - flutter pub add firebase_core firebase_auth cloud_firestore)
  # firebase_core: ^3.13.1
  # firebase_auth: ^5.5.2
  # cloud_firestore: ^5.6.6
  # firebase_storage: ^12.4.5
  # firebase_messaging: ^15.2.5

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.6

  # Utility
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
