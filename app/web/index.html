<body>
  <script>
    var _defaultTitle = '百物語 | 怪談投稿・実話ホラー短編コミュニティ';
    var _defaultDesc  = '日常に潜む恐怖を語る怪談投稿サービス。実話怪談・ホラー短編を投稿・閲覧・共有できる百物語コミュニティ。';
    var _baseUrl      = 'https://hyaku-35692.web.app';

    function _setMeta(sel, attr, val) {
      var el = document.querySelector(sel);
      if (el) el.setAttribute(attr, val);
    }

    function updateMeta(title, desc, url) {
      document.title = title;
      _setMeta('meta[name="description"]',          'content', desc);
      _setMeta('meta[property="og:title"]',         'content', title);
      _setMeta('meta[property="og:description"]',   'content', desc);
      _setMeta('meta[property="og:url"]',           'content', url);
      _setMeta('meta[name="twitter:title"]',        'content', title);
      _setMeta('meta[name="twitter:description"]',  'content', desc);
    }

    function resetMeta() {
      updateMeta(_defaultTitle, _defaultDesc, _baseUrl + '/');
      var el = document.getElementById('article-ld');
      if (el) el.textContent = '';
    }

    function adsbygooglePush() {
      try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
    }

    function updateArticleLd(title, desc, url, datePublished, author) {
      var el = document.getElementById('article-ld');
      if (!el) return;
      el.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": title,
        "description": desc,
        "url": url,
        "datePublished": datePublished,
        "author": { "@type": "Person", "name": author },
        "publisher": { "@type": "Organization", "name": "百物語", "url": _baseUrl }
      });
    }
  </script>
